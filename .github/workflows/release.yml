name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          pkg="github.com/drekunov/gc/internal/app"
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA::7}"
          build_time="$(date -u +%s)"
          ldflags="-X ${pkg}.version=${version} -X ${pkg}.commit=${commit} -X ${pkg}.branch=${version} -X ${pkg}.buildUnixTimestamp=${build_time}"
          bin="commander"
          if [ "${GOOS}" = "windows" ]; then
            bin="commander.exe"
          fi
          mkdir -p dist
          go build -ldflags "${ldflags}" -o "dist/${bin}" ./cmd/commander

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="commander_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -q "${target}.zip" commander.exe)
          else
            (cd dist && tar -czf "${target}.tar.gz" commander)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: commander-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum commander_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
